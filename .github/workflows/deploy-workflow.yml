name: helm-upgrade
run-name: ${{ github.actor }} - ${{ github.ref_name}}

on:
  workflow_call:
    inputs:
      environment:
        required: true
        description: 'The environment to deploy'
        type: string
      version:
        required: true
        description: 'The version of the helm chart to deploy'
        type: string
      helm-values-path:
        type: string
        default: './helm-charts/todoapp/values.yaml'
      helm-release-name:
        type: string
        default: 'todoapp'

deploy-helm:
        name: ${{ inputs.environment }}
        runs-on: ubuntu-24.04
        environment: ${{ inputs.environment }}

        steps:
        - uses: actions/download-artifact@v4
          with:
            name: helm-package
            path: .
        
        - uses: actions/download-artifact@v4
          with:
            name: helm-artifacts
            path: .
        
        - name: Set Up Helm
          uses: azure/setup-helm@v4.2.0

        - name: Set up Kubectl
          uses: azure/setup-kubectl@v4

        - name: Azure Login
          uses: azure/login@v2
          with:
            creds: ${{ secrets.AZURE_CREDENTIALS }}

      
        - name: Set AKS context
          shell: bash
          run: |
            az aks get-credentials \
              --resource-group "devops_todolist_cicd_task_5_deploy_to_k8s" \
              --name "mateapp-development-aks" \
              --overwrite-existing

        
        - name: Deploy helm chart to Development
          shell: bash
          run: |
            helm upgrade --install \
              --rollback-on-failure \
              --wait \
              --timeout 3600s \
              --debug $ {{ inputs.helm-release-name }} \
                ${{ inputs.helm-values-path }}
              --set mysql.config.MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
              --set mysql.config.MYSQL_USER="${{ secrets.MYSQL_USER }}" \
              --set mysql.config.MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
              --set todoapp.secrets.SECRET_KEY="${{ secrets.SECRET_KEY }}" \
              --set todoapp.secrets.DB_NAME="${{ secrets.DB_NAME }}" \
              --set todoapp.secrets.DB_USER="${{ secrets.DB_USER }}" \
              --set todoapp.secrets.DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              --set todoapp.secrets.DB_HOST="${{ secrets.DB_HOST }}" \
              --set-string todoapp.image.repository="${{ secrets.DOCKERHUB_USERNAME }}/todoapp" \
              --set-string todoapp.image.tag="${{ github.sha }}"
